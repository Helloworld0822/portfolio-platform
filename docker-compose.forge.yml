services:
  api:
    build:
      context: .
      dockerfile: backend-forge/Containerfile
    image: portfolio-platform-forge-api:latest
    environment:
      FORGE_TRUSTED_PROXIES: ${FORGE_PROXY_IP:-172.28.243.3}/32
    networks: [default, forge_proxy]
  nginx:
    build:
      args:
        NGINX_CONFIG: nginx/forge.conf
    networks:
      forge_proxy:
        ipv4_address: ${FORGE_PROXY_IP:-172.28.243.3}
networks:
  forge_proxy:
    ipam:
      config:
        - subnet: ${FORGE_PROXY_SUBNET:-172.28.243.0/29}
