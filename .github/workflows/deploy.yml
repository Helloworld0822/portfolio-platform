name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      api_runtime:
        description: API runtime (keep the currently serving implementation by default)
        type: choice
        options: [keep, stage-forge, forge, rust]
        default: keep
      forge_staging_commit:
        description: Exact main SHA verified in isolated Forge staging
        type: string
      forge_staging_digest:
        description: Exact linux/amd64 Forge API sha256 digest verified in staging
        type: string

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event.workflow_run.event == 'push'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: portfolio-514800
          workload_identity_provider: projects/1024499736581/locations/global/workloadIdentityPools/portfolio-actions/providers/github
          service_account: portfolio-deploy@portfolio-514800.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Release containers to Cloud Run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PORTFOLIO_API_RUNTIME: ${{ inputs.api_runtime || 'keep' }}
          FORGE_STAGING_COMMIT: ${{ inputs.forge_staging_commit }}
          FORGE_STAGING_DIGEST: ${{ inputs.forge_staging_digest }}
        run: bash scripts/deploy-cloud-run.sh
      - name: Authenticate staging requests
        if: inputs.api_runtime == 'stage-forge' && steps.release.outputs.api != ''
        id: stage_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: portfolio-514800
          workload_identity_provider: projects/1024499736581/locations/global/workloadIdentityPools/portfolio-actions/providers/github
          service_account: portfolio-deploy@portfolio-514800.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: urn:portfolio:forge-staging
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify isolated Forge service
        if: inputs.api_runtime == 'stage-forge' && steps.release.outputs.api != ''
        env:
          STAGE_ID_TOKEN: ${{ steps.stage_auth.outputs.id_token }}
          STAGE_COMMIT: ${{ steps.release.outputs.commit }}
          STAGE_API: ${{ steps.release.outputs.api }}
          STAGE_NGINX: ${{ steps.release.outputs.nginx }}
        run: bash scripts/stage-forge-cloud-run.sh "$STAGE_COMMIT" "$STAGE_API" "$STAGE_NGINX"
      - name: Save verified staging result
        if: inputs.api_runtime == 'stage-forge' && steps.release.outputs.api != ''
        uses: actions/upload-artifact@v4
        with:
          name: forge-staging-evidence
          path: ${{ runner.temp }}/forge-staging-evidence.json
          if-no-files-found: error
