server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 location /api/ { proxy_pass http://api:8080; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Host $host; client_max_body_size 25m; }
 location /uploads/ { proxy_pass http://api:8080; }
 location / { try_files $uri /index.html; }
}
