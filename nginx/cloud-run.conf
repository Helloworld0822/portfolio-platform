events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml application/xml+rss image/svg+xml;

    # Cloud Run restricts ingress to the load balancer, which overwrites this
    # header with the connecting client's address.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Portfolio-Client-IP;
    real_ip_recursive off;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=uploads_limit:10m rate=60r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_conn_status 429;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        limit_conn conn_limit 20;
        client_max_body_size 25m;

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /uploads/ {
            limit_req zone=uploads_limit burst=100 nodelay;
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /assets/ {
            limit_req zone=general_limit burst=60 nodelay;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            limit_req zone=general_limit burst=60 nodelay;
            add_header Cache-Control "no-cache";
        }

        location / {
            limit_req zone=general_limit burst=60 nodelay;
            try_files $uri $uri/ /index.html;
        }
    }
}
