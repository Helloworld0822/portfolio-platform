events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Behind the Cloudflare Tunnel, $remote_addr is cloudflared's own
    # connection (loopback/bridge IP), not the visitor. Cloudflare adds
    # CF-Connecting-IP with the real client IP; fall back to $remote_addr
    # when it's absent (direct/local access). Trusting this header is only
    # safe because docker-compose.yml binds nginx's published port to
    # 127.0.0.1 -- cloudflared is the only process that can ever reach it,
    # so nothing else can forge this header.
    map $http_cf_connecting_ip $client_ip {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }

    limit_req_zone $client_ip zone=api_limit:10m rate=10r/s;
    limit_req_zone $client_ip zone=general_limit:10m rate=30r/s;
    limit_req_zone $client_ip zone=uploads_limit:10m rate=60r/s;
    limit_req_status 429;
    limit_conn_zone $client_ip zone=conn_limit:10m;
    limit_conn_status 429;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        limit_conn conn_limit 20;

        # Matches the backend's PayloadConfig limit (lib.rs, 25MB) which is
        # above uploads.rs's 20MB file cap, so nginx's 1MB default doesn't
        # reject larger admin uploads before they reach the api.
        client_max_body_size 25m;

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin-uploaded files are served by the api container (actix-files).
        # Must be proxied BEFORE the catch-all so /uploads/* never hits the
        # static file root.
        location /uploads/ {
            # Higher burst than /api/: a single project or post page can
            # render dozens of attachments in one paint, all fetched at once.
            limit_req zone=uploads_limit burst=100 nodelay;
            proxy_pass http://api:8080/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Vite's hashed filenames make content immutable per-URL: cache
        # aggressively and let a new deploy simply ship new filenames.
        location /assets/ {
            limit_req zone=general_limit burst=60 nodelay;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # index.html itself must always be revalidated so a new deploy's
        # asset hashes are picked up instead of a stale cached shell.
        location = /index.html {
            limit_req zone=general_limit burst=60 nodelay;
            add_header Cache-Control "no-cache";
        }

        location / {
            limit_req zone=general_limit burst=60 nodelay;
            try_files $uri $uri/ /index.html;
        }
    }
}
