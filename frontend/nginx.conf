server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets (index-<hash>.js/css) are safe to cache forever; index.html
    # itself must always be revalidated so a new deploy's asset hashes are
    # picked up instead of being served from a stale cached shell.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
