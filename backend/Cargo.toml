[package]
name = "portfolio-blog-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "portfolio_blog_api"
path = "src/lib.rs"

[[bin]]
name = "portfolio-blog-api"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-multipart = "0.7"
actix-files = "0.6"
tokio = { version = "1", features = ["full"] }
bb8 = "0.8"
bb8-postgres = "0.8"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
slug = "0.1"
rand = "0.8"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"
urlencoding = "2"
futures-util = "0.3"
utoipa = { version = "5", features = ["actix_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "8", features = ["actix-web", "vendored"] }

[dev-dependencies]
wiremock = "0.6"
actix-http = "3"
